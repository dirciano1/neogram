<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.8" />
  <title>NeoGram - Ecossistema Inteligente</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- FUNDO ANIMADO -->
  <div class="bg-animation"></div>

  <!-- CABEÇALHO -->
  <header class="header">
    <div class="header-content">
      <img src="images/neogram-logo.png" class="logo-header" alt="NeoGram Logo" />
      <h1 class="title">NeoGram</h1>
    </div>
    <p class="subtitle">Ecossistema de ferramentas inteligentes impulsionadas por IA</p>
  </header>

  <!-- SLIDER -->
  <div class="slider-wrapper">

    <!-- SETAS -->
    <div class="arrow left" onclick="prevSlide()">&#10094;</div>
    <div class="arrow right" onclick="nextSlide()">&#10095;</div>

    <!-- CARROSSEL -->
    <div id="carousel" class="carousel">

      <!-- BetGram -->
      <div class="slide">
        <a class="card-link" href="#">
          <div class="card">
            <img src="images/betgram-logo.png" alt="BetGram" />
            <h3>BetGram</h3>
          </div>
        </a>
      </div>

      <!-- BusinessGram -->
      <div class="slide">
        <a class="card-link" href="#">
          <div class="card">
            <img src="images/businessgram-logo.png" alt="BusinessGram" />
            <h3>BusinessGram</h3>
          </div>
        </a>
      </div>

      <!-- CryptoGram -->
      <div class="slide">
        <a class="card-link" href="#">
          <div class="card">
            <img src="images/cryptogram-logo.png" alt="CryptoGram" />
            <h3>CryptoGram</h3>
          </div>
        </a>
      </div>

      <!-- InvestGram -->
      <div class="slide">
        <a class="card-link" href="#">
          <div class="card">
            <img src="images/investgram-logo.png" alt="InvestGram" />
            <h3>InvestGram</h3>
          </div>
        </a>
      </div>

      <!-- TalkGram -->
      <div class="slide">
        <a class="card-link" href="#">
          <div class="card">
            <img src="images/talkgram-logo.png" alt="TalkGram" />
            <h3>TalkGram</h3>
          </div>
        </a>
      </div>

      <!-- NeoGram -->
      <div class="slide">
        <a class="card-link" href="#">
          <div class="card">
            <img src="images/neogram-logo.png" alt="NeoGram" />
            <h3>NeoGram</h3>
          </div>
        </a>
      </div>

    </div>

    <!-- INDICADORES -->
    <div class="indicators">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>

  <!-- DESCRIÇÃO DO PRODUTO -->
  <div id="product-description" class="product-description">
    <h2>BetGram</h2>
    <p>Sistema avançado de inteligência esportiva que identifica oportunidades, analisa riscos e entrega apostas estratégicas</p>
  </div>

  <!-- SCRIPT -->
  <script>
    let current = 0;
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");
    const carousel = document.getElementById("carousel");
    const descriptionBox = document.getElementById("product-description");

    const descriptions = [
      {
        name: "BetGram",
        text: "Sistema avançado de inteligência esportiva que identifica oportunidades, analisa riscos e entrega apostas estratégicas"
      },
      {
        name: "BusinessGram",
        text: "Assistente estratégico que identifica tendências de mercado, sugere ideias lucrativas e orienta a criação de negócios atuais."
      },
      {
        name: "CryptoGram",
        text: "Plataforma inteligente para análise de criptomoedas que monitora tendências, identifica movimentos e otimiza decisões."
      },
      {
        name: "InvestGram",
        text: "Ferramenta inteligente de suporte financeiro que avalia cenários, analisa ativos e orienta decisões estratégicas com precisão."
      },
      {
        name: "TalkGram",
        text: "Assistente dedicado ao ecossistema NeoGram que esclarece dúvidas, explica recursos, orienta usos e conecta você aos produtos."
      },
      {
        name: "NeoGram",
        text: "Plataforma central de inteligência que conecta todas as ferramentas do ecossistema, integra dados, unifica tecnologias e potencializa resultados com IA avançada."
      }
    ];

    function updateSlider() {
      carousel.scrollTo({
        left: current * window.innerWidth,
        behavior: "smooth",
      });

      dots.forEach(dot => dot.classList.remove("active"));
      dots[current].classList.add("active");

      descriptionBox.innerHTML = `
        <h2>${descriptions[current].name}</h2>
        <p>${descriptions[current].text}</p>
      `;
    }

    function nextSlide() {
      current = (current + 1) % slides.length;
      updateSlider();
    }

    function prevSlide() {
      current = (current - 1 + slides.length) % slides.length;
      updateSlider();
    }

    setInterval(nextSlide, 6000);
    window.addEventListener("resize", updateSlider);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Pagamento NeoGram</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
      }
      iframe {
        width: 100%;
        height: 100vh;
        border: none;
      }
    </style>
  </head>
  <body>
    <script>
      function getUid() {
        const params = new URLSearchParams(window.location.search);
        return params.get("uid");
      }

      const uid = getUid();

      if (!uid) {
        document.body.innerHTML =
          "<h2 style='color:white;text-align:center;margin-top:40px'>❌ Nenhum UID informado.</h2>";
      } else {
        document.body.innerHTML = `
          <iframe src="https://betgram.com.br/payments?uid=${uid}"></iframe>
        `;
      }
    </script>
    <script>
  window.addEventListener("message", (event) => {
    if (event.data === "fechar_pagamento") {
      console.log("Fechando janela via postMessage…");

      // Tenta fechar a aba normalmente
      window.close();

      // Caso a aba não permita fechar (navegadores com bloqueio)
      try {
        window.open("", "_self");
        window.close();
      } catch (e) {}

      // Último fallback: envia de volta pro chamador que pode fechar
      // (TalkGram pode reagir se quiser futuramente)
      window.parent.postMessage("fechamento_falhou", "*");
    }
  });
</script>
  </body>
</html>

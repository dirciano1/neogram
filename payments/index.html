<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Pagamento NeoGram</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
      }

      iframe {
        width: 100vw;
        height: 100dvh; /* melhor no mobile */
        border: none;
        display: block;
      }
    </style>
  </head>

  <body>
    <script>
      function getUid() {
        const params = new URLSearchParams(window.location.search);
        return params.get("uid");
      }

      const uid = getUid();

      if (!uid) {
        document.body.innerHTML =
          "<h2 style='color:white;text-align:center;margin-top:40px'>❌ Nenhum UID informado.</h2>";
      } else {
        document.body.innerHTML = `
          <iframe src="https://betgram.com.br/payments?uid=${encodeURIComponent(uid)}"></iframe>
        `;
      }

      window.addEventListener("message", (event) => {
        // Segurança básica: aceite só do domínio correto
        if (event.origin !== "https://betgram.com.br") return;

        if (event.data === "fechar_pagamento") {
          window.close();
          try {
            window.open("", "_self");
            window.close();
          } catch (e) {}
          window.parent.postMessage("fechamento_falhou", "*");
        }
      });
    </script>
  </body>
</html>
